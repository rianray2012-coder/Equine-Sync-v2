<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EquineSync</title>
</head>
<body style="margin:0;padding:0;background:#111111;color:#F5F2EC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#111111;padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="background:#1A1A1A;border:1px solid #2E2E2E;border-radius:16px;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="padding:32px 36px 24px 36px;border-bottom:1px solid #2A2A2A;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family:Georgia,'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:0.5px;color:#F5F2EC;">
                    EquineSync
                  </td>
                  <td align="right" style="font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#BFC5CC;">
                    Stable Operating System
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:36px;color:#D9D9D9;line-height:1.65;font-size:15px;">
              {content}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 36px;border-top:1px solid #2A2A2A;font-size:11px;color:#7a7a7a;letter-spacing:0.3px;">
              You're receiving this because someone at <strong style="color:#BFC5CC;">{barn_name}</strong> invited you to EquineSync.
              <br/>If this wasn't you, simply ignore this message — no account will be created.
              <br/><br/>
              <span style="color:#5a5a5a;">© EquineSync · Crafted for elite equestrian operations</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
