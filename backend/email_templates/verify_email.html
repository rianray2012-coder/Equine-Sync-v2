<div style="font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#BFC5CC;margin-bottom:14px;">Confirm your email</div>
<div style="font-family:Georgia,'Cormorant Garamond',serif;font-size:30px;font-weight:400;color:#F5F2EC;line-height:1.15;margin-bottom:18px;">
  Welcome to EquineSync
</div>
<p style="margin:0 0 18px 0;">
  Hello {full_name},
</p>
<p style="margin:0 0 18px 0;">
  Thanks for creating your EquineSync account. Please confirm your email address to finish setting things up.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 24px 0;">
  <tr>
    <td style="border-radius:999px;background:#BFC5CC;">
      <a href="{verify_url}" target="_blank" rel="noopener"
         style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:600;color:#111111;text-decoration:none;letter-spacing:0.3px;">
         Confirm email &nbsp;→
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 8px 0;font-size:13px;color:#9d9d9d;">
  This link is valid for <strong style="color:#D9D9D9;">{ttl_label}</strong>.
</p>
<p style="margin:0 0 0 0;font-size:12px;color:#7a7a7a;">
  Trouble with the button? Paste this URL into your browser:<br/>
  <span style="color:#BFC5CC;word-break:break-all;">{verify_url}</span>
</p>
